[advisories]
unmaintained = "all"
yanked = "deny"
# Existing compile-time macro dependency of the latest allocator control crate.
# Owner: repository maintainers; review/expiry 2026-11-28.
# scripts/check-advisory-exceptions.py enforces expiry and the exact parent.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is an unmaintained build-time macro dependency; latest tikv-jemalloc-ctl has no replacement. Recheck upstream by 2026-11-28." },
]

[licenses]
include-dev = true
include-build = true
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "OpenSSL",
    "Unicode-3.0",
]

# serde_json's hash implementation; permissive Zlib terms, scoped to this crate.
[[licenses.exceptions]]
name = "foldhash"
version = "0.2.0"
allow = ["Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
