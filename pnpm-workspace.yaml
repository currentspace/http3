packages:
  - .
  - examples/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

catalog:
  '@eslint/js': ^10.0.1
  '@napi-rs/cli': ^3.7.2
  '@types/node': ^26.0.1
  c8: ^11.0.0
  eslint: ^10.6.0
  playwright: ^1.61.1
  typescript: ^6.0.3
  typescript-eslint: ^8.62.1

# Source builds use local native artifacts, not previously published prebuilds.
ignoredOptionalDependencies:
  - "@currentspace/http3-darwin-arm64"
  - "@currentspace/http3-linux-arm64-gnu"
  - "@currentspace/http3-linux-x64-gnu"
