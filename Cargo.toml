[workspace]
members = [".", "fuzz", "tools/rust-h3-load"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
bytes = "1"
criterion = "0.8"
crossbeam-channel = "0.5"
env_logger = "0.11"
io-uring = "0.7"
libc = "0.2"
libfuzzer-sys = "0.4"
log = "0.4"
loom = "0.7"
mio = "1"
napi = "3"
napi-build = "2"
napi-derive = "3"
nix = "0.31"
quiche = "0.29"
rcgen = "0.14"
ring = "0.17"
serde = "1"
serde_json = "1"
slab = "0.4"
socket2 = "0.6"
tikv-jemalloc-ctl = "0.6"
tikv-jemallocator = "0.6"

[package]
name = "http3"
version = "0.8.4"
edition.workspace = true
rust-version.workspace = true
autobins = false

[features]
default = ["node-api", "native-jemalloc"]
node-api = []
native-jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-ctl"]
profile-binary = ["rcgen"]
bench-internals = []
driver-tracing = []
fuzzing = []

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "quic_loopback_profile"
path = "src/bin/quic_loopback_profile.rs"
required-features = ["profile-binary"]

[[bin]]
name = "quic_direct_profile"
path = "src/bin/quic_direct_profile.rs"
required-features = ["profile-binary"]

[[bin]]
name = "quic_multiclient_bench"
path = "src/bin/quic_multiclient_bench.rs"
required-features = ["profile-binary"]

[[bin]]
name = "quic_mock_sustained"
path = "src/bin/quic_mock_sustained.rs"
required-features = ["profile-binary"]

[dependencies]
napi = { workspace = true, features = ["napi4", "napi6", "napi8"] }
napi-derive.workspace = true
quiche = { workspace = true, features = ["qlog"] }
ring.workspace = true
log.workspace = true
slab.workspace = true
bytes.workspace = true
crossbeam-channel.workspace = true
libc.workspace = true
socket2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
env_logger.workspace = true
rcgen = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { workspace = true, features = ["event"] }
tikv-jemallocator = { workspace = true, features = ["disable_initial_exec_tls"], optional = true }
tikv-jemalloc-ctl = { workspace = true, features = ["disable_initial_exec_tls"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring.workspace = true
tikv-jemallocator = { workspace = true, features = ["disable_initial_exec_tls"], optional = true }
tikv-jemalloc-ctl = { workspace = true, features = ["disable_initial_exec_tls"], optional = true }

[build-dependencies]
napi-build.workspace = true

[dev-dependencies]
mio = { workspace = true, features = ["os-poll", "net"] }
rcgen.workspace = true
criterion = { workspace = true, features = ["html_reports"] }
env_logger.workspace = true
loom.workspace = true

[[bench]]
name = "driver_udp"
harness = false

[[bench]]
name = "quic_mock_pair"
harness = false

[profile.release]
debug = 1  # line tables for perf/flamegraph symbol resolution

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(kani_contracts)'] }
unsafe_code = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that conflict with napi-rs generated code or QUIC domain
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"   # napi macro requires owned String params
cast_possible_wrap = "allow"       # u64→i64 casts required by napi JS interop
cast_sign_loss = "allow"           # i64→u64 casts required by napi JS interop
cast_possible_truncation = "allow" # u128→i64 for millisecond timers
doc_markdown = "allow"             # QUIC/HTTP/3 identifiers in docs
unnecessary_wraps = "allow"        # napi requires Result return types on all methods
# Restriction lints (cherry-picked)
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
