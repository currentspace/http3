name: Alpine installed consumers

on:
  workflow_call:

jobs:
  installed:
    name: Alpine ${{ matrix.arch }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            node: '24'
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04
            arch: x64
            node: '26'
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            node: '24'
            target: aarch64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            node: '26'
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prebuild-${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-client-artifact
          path: dist/wasm
      - name: Pack candidate and exact musl sidecar
        run: |
          pnpm run patch:native-loader
          pnpm run build:dist
          mkdir -p artifacts/packed
          pnpm pack --config.ignore-scripts=true --pack-destination artifacts/packed
          node scripts/pack-host-native.mjs artifacts/packed --target linux-${{ matrix.arch }}-musl
      - name: Verify clean Alpine install with and without the native sidecar
        run: |
          image=$(node -p 'require("./containers/node-musl-images.json")["${{ matrix.node }}"]')
          docker run --rm -v "$PWD:/candidate:ro" -w /candidate "$image" sh -eu -c '
            apk add --no-cache openssl
            node scripts/platform-smoke.mjs --tarball artifacts/packed/currentspace-http3-[0-9]*.tgz
            node scripts/platform-smoke.mjs --native --tarball artifacts/packed/currentspace-http3-[0-9]*.tgz --sidecar artifacts/packed/currentspace-http3-linux-${{ matrix.arch }}-musl-*.tgz
          '
