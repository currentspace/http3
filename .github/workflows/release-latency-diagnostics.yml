name: Release latency diagnostics
on:
  push:
    branches: [ci/0.9.9-intel-latency-profile]
permissions:
  contents: read
jobs:
  profile:
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.16.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: pnpm install --frozen-lockfile && pnpm run build && pnpm run build:test
      - name: Capture latency and CPU profiles
        shell: bash
        run: |
          mkdir -p artifacts/intel-latency
          node --version > artifacts/intel-latency/system.txt
          sysctl hw.ncpu hw.memsize machdep.cpu.brand_string >> artifacts/intel-latency/system.txt
          uptime >> artifacts/intel-latency/system.txt
          top -l 1 -n 0 >> artifacts/intel-latency/system.txt
          node -e 'const {performance}=require("node:perf_hooks");let last=performance.now();const gaps=[];const t=setInterval(()=>{const now=performance.now();gaps.push(now-last);last=now},5);setTimeout(()=>{clearInterval(t);gaps.sort((a,b)=>a-b);console.log(JSON.stringify({samples:gaps.length,p95:gaps[Math.ceil(gaps.length*.95)-1],max:gaps.at(-1)}))},2000)' > artifacts/intel-latency/idle.json
          for attempt in 1 2 3; do
            if node scripts/concurrency-gate.mjs > "artifacts/intel-latency/gate-$attempt.log" 2>&1; then
              echo "gate $attempt passed"
            else
              echo "gate $attempt failed; captured for diagnosis"
            fi
          done
          if node --cpu-prof --cpu-prof-dir=artifacts/intel-latency --test --test-isolation=none --test-timeout=25000 dist-test/test/perf-gates/worker-concurrency.test.js > artifacts/intel-latency/profile.log 2>&1; then
            echo 'profiled workload passed'
          else
            echo 'profiled workload failed; captured for diagnosis'
          fi
          uptime >> artifacts/intel-latency/system.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: intel-latency
          path: artifacts/intel-latency
          if-no-files-found: error
