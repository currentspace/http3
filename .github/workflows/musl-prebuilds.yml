name: Native musl prebuilds

on:
  workflow_call:

jobs:
  prebuilds-musl:
    name: prebuild musl (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and load-test on native Alpine architecture
        run: |
          docker build -f Dockerfile.musl --target artifact --output type=local,dest=artifacts/musl .
          test -f artifacts/musl/http3.linux-${{ matrix.arch }}-musl.node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-${{ matrix.target }}
          path: artifacts/musl/*
          if-no-files-found: error
