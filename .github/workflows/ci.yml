name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Lint TypeScript sources
        run: pnpm run lint

      - name: Typecheck library and tests
        run: pnpm run typecheck

      - name: Rust clippy
        run: |
          cargo clippy --lib
          cargo clippy --tests --features bench-internals --no-default-features

      - name: Rust unit tests
        run: cargo test --lib --no-default-features

      - name: Build native + TypeScript
        run: pnpm run build

      - name: Run full test suite
        run: pnpm test

      - name: Run concurrency performance gate
        env:
          HTTP3_CONCURRENCY_MAX_MS: '12000'
        run: pnpm run perf:concurrency-gate

      - name: Run load smoke gate
        env:
          HTTP3_LOAD_SMOKE_TOTAL: '150'
          HTTP3_LOAD_SMOKE_CONCURRENCY: '25'
          HTTP3_LOAD_SMOKE_MAX_MS: '10000'
        run: pnpm run perf:load-smoke-gate

      - name: Smoke install from packed artifact
        run: pnpm run smoke:install

  docker-runtime-matrix-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Linux arm64 Docker runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime-test
          platforms: linux/arm64
          load: true
          tags: currentspace/http3-runtime-tests:dev
          cache-from: type=gha,scope=http3-runtime-tests-linux-arm64
          cache-to: type=gha,mode=max,scope=http3-runtime-tests-linux-arm64

      - name: Run Linux arm64 Docker runtime matrix
        env:
          DOCKER_RUNTIME_PLATFORM: linux/arm64
          HTTP3_RUNTIME_SKIP_BUILD: '1'
        run: pnpm run test:docker:runtime

  runtime-io-uring:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Linux amd64 Docker runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime-test
          platforms: linux/amd64
          load: true
          tags: currentspace/http3-runtime-tests:dev
          cache-from: type=gha,scope=http3-runtime-tests-linux-amd64
          cache-to: type=gha,mode=max,scope=http3-runtime-tests-linux-amd64

      - name: Run Linux io_uring Docker runtime matrix
        env:
          DOCKER_RUNTIME_PLATFORM: linux/amd64
          HTTP3_RUNTIME_SKIP_BUILD: '1'
          HTTP3_RUNTIME_TEST_PRIVILEGED: '1'
        run: pnpm run test:docker:runtime:privileged
