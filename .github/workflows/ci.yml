name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '25', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Lint TypeScript sources
        run: pnpm run lint

      - name: Typecheck library and tests
        run: pnpm run typecheck

      - name: Rust clippy
        run: |
          cargo clippy --lib
          cargo clippy --tests --features bench-internals --no-default-features

      - name: Rust unit tests
        run: cargo test --lib --no-default-features

      - name: Build native + TypeScript
        run: pnpm run build

      - name: Run full test suite
        run: pnpm test

      - name: Run concurrency performance gate
        env:
          HTTP3_CONCURRENCY_MAX_MS: '12000'
        run: pnpm run perf:concurrency-gate

      - name: Run load smoke gate
        env:
          HTTP3_LOAD_SMOKE_TOTAL: '150'
          HTTP3_LOAD_SMOKE_CONCURRENCY: '25'
          HTTP3_LOAD_SMOKE_MAX_MS: '10000'
        run: pnpm run perf:load-smoke-gate

      - name: Smoke install from packed artifact
        run: pnpm run smoke:install

  wasm:
    name: wasm client/server build + tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust with wasm32-wasip1 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Cache cargo (wasm32-wasip1)
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-wasip1-wasi-sdk-33

      - name: Setup wasi-sdk + binaryen
        uses: ./.github/actions/setup-wasi-sdk

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Build wasm client artifact
        run: pnpm run build:wasm

      - name: Run wasm test suite
        run: HTTP3_WASM=1 pnpm run test:wasm

  docker-runtime-matrix-arm64:
    name: docker runtime arm64 (node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '25', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Linux arm64 Docker runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime-test
          platforms: linux/arm64
          build-args: |
            NODE_MAJOR=${{ matrix.node-version }}
          load: true
          tags: currentspace/http3-runtime-tests:node${{ matrix.node-version }}-dev
          cache-from: type=gha,scope=http3-runtime-tests-node${{ matrix.node-version }}-linux-arm64
          cache-to: type=gha,mode=max,scope=http3-runtime-tests-node${{ matrix.node-version }}-linux-arm64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Run Linux arm64 Docker runtime matrix
        env:
          NODE_MAJOR: ${{ matrix.node-version }}
          HTTP3_RUNTIME_IMAGE: currentspace/http3-runtime-tests:node${{ matrix.node-version }}-dev
          DOCKER_RUNTIME_PLATFORM: linux/arm64
          HTTP3_RUNTIME_SKIP_BUILD: '1'
        run: pnpm run test:docker:runtime

  runtime-io-uring:
    name: docker runtime io_uring (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '25', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Linux amd64 Docker runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime-test
          platforms: linux/amd64
          build-args: |
            NODE_MAJOR=${{ matrix.node-version }}
          load: true
          tags: currentspace/http3-runtime-tests:node${{ matrix.node-version }}-dev
          cache-from: type=gha,scope=http3-runtime-tests-node${{ matrix.node-version }}-linux-amd64
          cache-to: type=gha,mode=max,scope=http3-runtime-tests-node${{ matrix.node-version }}-linux-amd64

      - name: Run Linux io_uring Docker runtime matrix
        env:
          NODE_MAJOR: ${{ matrix.node-version }}
          HTTP3_RUNTIME_IMAGE: currentspace/http3-runtime-tests:node${{ matrix.node-version }}-dev
          DOCKER_RUNTIME_PLATFORM: linux/amd64
          HTTP3_RUNTIME_SKIP_BUILD: '1'
          HTTP3_RUNTIME_TEST_PRIVILEGED: '1'
        run: pnpm run test:docker:runtime:privileged
