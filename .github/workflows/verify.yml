name: Verify

# Single-entry full-suite gate. Runs the canonical scripts/verify.sh
# locally on ubuntu, on macOS, and inside Dockerfile.verify (debian latest).
# Browser HTTP/3 validation runs in the macOS jobs because the three-browser
# certificate trust path is platform-specific.
#
# kqueue-specific Rust integration tests are gated by #[cfg(target_os =
# "macos")] in the Rust source — they don't compile or run on Linux, so
# this CI matrix doesn't need to skip them explicitly.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-local:
    name: verify (ubuntu, native, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '25', '26']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Run full verify
        env:
          VERIFY_SKIP_BROWSER_E2E: '1'
        run: pnpm verify

  verify-macos:
    name: verify (${{ matrix.os }}, kqueue, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]
        node-version: ['24', '25', '26']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Run full verify
        run: pnpm verify

  verify-docker:
    name: verify (debian latest, docker, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '25', '26']
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build verify image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.verify
          build-args: |
            NODE_MAJOR=${{ matrix.node-version }}
          tags: http3-verify:node${{ matrix.node-version }}
          load: true
          cache-from: type=gha,scope=http3-verify-node${{ matrix.node-version }}
          cache-to: type=gha,mode=max,scope=http3-verify-node${{ matrix.node-version }}

      - name: Run verify inside container
        run: docker run --rm -e VERIFY_SKIP_BROWSER_E2E=1 http3-verify:node${{ matrix.node-version }}
