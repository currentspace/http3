name: Verify

# Single-entry full-suite gate. Runs the canonical scripts/verify.sh
# locally on ubuntu, on macOS, and inside Dockerfile.verify (debian latest).
# Browser HTTP/3 validation runs in the macOS jobs because the three-browser
# certificate trust path is platform-specific.
#
# kqueue-specific Rust integration tests are gated by #[cfg(target_os =
# "macos")] in the Rust source — they don't compile or run on Linux, so
# this CI matrix doesn't need to skip them explicitly.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-local:
    name: verify (${{ matrix.os }}, native, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        node-version: ['24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run full verify
        env:
          VERIFY_SKIP_BROWSER_E2E: '1'
        # Invoke directly so verify.sh controls dependency installation.
        run: bash scripts/verify.sh

  verify-macos:
    name: verify (${{ matrix.os }}, kqueue, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-26]
        node-version: ['24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run full verify
        # Invoke directly so verify.sh controls dependency installation.
        run: bash scripts/verify.sh

  verify-docker:
    name: verify (debian latest, docker, node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve pinned Node image
        id: node-image
        run: echo "image=$(node scripts/node-container-image.mjs '${{ matrix.node-version }}')" >> "$GITHUB_OUTPUT"

      - name: Build verify image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.verify
          build-args: |
            NODE_IMAGE=${{ steps.node-image.outputs.image }}
          tags: http3-verify:node${{ matrix.node-version }}
          load: true
          cache-from: type=gha,scope=http3-verify-node${{ matrix.node-version }}
          cache-to: type=gha,mode=max,scope=http3-verify-node${{ matrix.node-version }}

      - name: Run verify inside container
        run: docker run --rm -e VERIFY_SKIP_BROWSER_E2E=1 http3-verify:node${{ matrix.node-version }}
