name: Verify

# Single-entry full-suite gate. Runs the canonical scripts/verify.sh
# locally on ubuntu, on macOS, and inside Dockerfile.verify (debian latest).
# Browser HTTP/3 validation runs in the macOS jobs because the three-browser
# certificate trust path is platform-specific.
#
# kqueue-specific Rust integration tests are gated by #[cfg(target_os =
# "macos")] in the Rust source — they don't compile or run on Linux, so
# this CI matrix doesn't need to skip them explicitly.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-local:
    name: verify (ubuntu, native)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Run full verify
        env:
          VERIFY_SKIP_BROWSER_E2E: '1'
        run: pnpm verify

  verify-macos:
    name: verify (${{ matrix.os }}, kqueue)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.1.2 --activate

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Run full verify
        run: pnpm verify

  verify-docker:
    name: verify (debian latest, docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build verify image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.verify
          tags: http3-verify:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run verify inside container
        run: docker run --rm -e VERIFY_SKIP_BROWSER_E2E=1 http3-verify:latest
