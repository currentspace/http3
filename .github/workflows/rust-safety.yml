name: Rust Safety

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 2'
  workflow_dispatch:

concurrency:
  group: rust-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: safety smoke (pinned stable + nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Bootstrap pinned safety tools
        env:
          HTTP3_SAFETY_FORCE_TOOL_INSTALL: '1'
        run: bash scripts/rust-safety-bootstrap.sh

      - name: Run safety smoke
        run: bash scripts/rust-safety-smoke.sh

  scheduled-deep:
    name: scheduled deep safety
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Bootstrap pinned safety tools
        env:
          HTTP3_SAFETY_FORCE_TOOL_INSTALL: '1'
        run: bash scripts/rust-safety-bootstrap.sh

      - name: Bootstrap pinned Verus
        run: bash scripts/rust-verus-bootstrap.sh

      - name: AddressSanitizer smoke
        run: bash scripts/rust-sanitizer-asan.sh

      - name: One-minute fuzz campaigns
        run: |
          cargo +nightly-2026-10-28 fuzz run unsafe_wrappers -- -max_total_time=60
          cargo +nightly-2026-10-28 fuzz run unsafe_wrappers_structured -- -max_total_time=60
          cargo +nightly-2026-10-28 fuzz run pending_write_state -- -max_total_time=60
          cargo +nightly-2026-10-28 fuzz run pending_write_ops -- -max_total_time=60
          cargo +nightly-2026-10-28 fuzz run parse_recv_cmsgs -- -max_total_time=60
          cargo +nightly-2026-10-28 fuzz run parse_recv_cmsgs_structured -- -max_total_time=60
          cargo +nightly-2026-10-28 fuzz run retry_token_roundtrip -- -max_total_time=60

      - name: Kani proof smoke
        env:
          HTTP3_KANI_DEEP: '1'
          # retry_token_round_trip_recovers_full_length_odcid needs ~185s
          # to solve; the default 60s (fine for every other harness) isn't
          # enough for it.
          HTTP3_KANI_HARNESS_TIMEOUT: '300s'
        run: bash scripts/rust-kani-smoke.sh

      - name: Verus proof smoke
        env:
          HTTP3_VERUS_REQUIRED: '1'
        run: bash scripts/rust-verus-smoke.sh
