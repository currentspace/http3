name: Next.js and NestJS Express example

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'scripts/pack-host-native.mjs'
      - 'examples/nextjs-nestjs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/nextjs-nestjs-example.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'src/**'
      - 'scripts/pack-host-native.mjs'
      - 'examples/nextjs-nestjs/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/nextjs-nestjs-example.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nextjs-nestjs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Candidate combined app (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.1', '26.13.0']
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Install the candidate into an isolated example
        run: |
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/combined"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/candidate"
          node scripts/pack-host-native.mjs "$RUNNER_TEMP/candidate"
          cp -R examples/nextjs-nestjs/{src,web,scripts,package.json,tsconfig.json} "$RUNNER_TEMP/combined/"
          cd "$RUNNER_TEMP/combined"
          npm install --include=optional --no-save --package-lock=false --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/candidate/*.tgz
          npx playwright install --with-deps chromium
          npm run certs
          npm run build:server
      - name: Development protocols, cookies and Fast Refresh
        working-directory: ${{ runner.temp }}/combined
        run: |
          npm run test:protocols
          HTTP3_TEST_REPORT=dev-h3.json npm run test:browser
          HTTP3_TEST_PROTOCOL=h2 HTTP3_TEST_REPORT=dev-h2.json npm run test:browser
      - run: npm run build
        working-directory: ${{ runner.temp }}/combined
      - name: Built application protocols, cookies and streaming
        working-directory: ${{ runner.temp }}/combined
        env:
          NODE_ENV: production
        run: |
          npm run test:protocols
          HTTP3_TEST_REPORT=production-h3.json npm run test:browser
          HTTP3_TEST_PROTOCOL=h2 HTTP3_TEST_REPORT=production-h2.json npm run test:browser
      - name: Preserve browser protocol evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: combined-browser-node-${{ matrix.node }}
          path: ${{ runner.temp }}/combined/*-h?.json
          if-no-files-found: ignore
          retention-days: 7
