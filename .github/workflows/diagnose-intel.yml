name: Diagnose Intel concurrency
on:
  push:
    branches: [diagnose/intel-concurrency]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record host resources
        run: |
          node --version
          rustc --version
          sysctl hw.logicalcpu hw.memsize
          vm_stat
          df -h .
      - name: Install locked dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --no-optional
      - name: Build native addon and JavaScript
        timeout-minutes: 8
        run: pnpm run build:debug
      - name: Compile tests
        run: pnpm run build:test
      - name: Native Node suite
        timeout-minutes: 6
        run: node scripts/test-node.mjs
      - name: FFI suite
        timeout-minutes: 5
        run: node --test --test-timeout=15000 'dist-test/test/ffi/**/*.test.js'
      - name: Concurrency gate with native-call timing
        timeout-minutes: 3
        env:
          HTTP3_CONCURRENCY_MAX_MS: '12000'
        run: |
          export NODE_OPTIONS="--require=$PWD/.github/diagnostics/native-timing.cjs"
          node scripts/concurrency-gate.mjs
      - name: Final resources
        if: always()
        run: |
          vm_stat
          ps -axo pid,ppid,%cpu,rss,comm | sort -nrk3 | head -20
