name: Diagnose macOS concurrency
on:
  push:
    branches: [diagnose/intel-concurrency]
permissions:
  contents: read
jobs:
  diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            node: '25'
            replica: 1
          - os: macos-14
            node: '25'
            replica: 2
          - os: macos-14
            node: '25'
            replica: 3
          - os: macos-15-intel
            node: '26'
            replica: 1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record host resources
        run: |
          node --version
          rustc --version
          sysctl hw.logicalcpu hw.memsize
          vm_stat
      - run: pnpm install --frozen-lockfile --no-optional
      - name: Build native addon and tests
        run: pnpm run build && pnpm run build:test
      - name: Native Node suite
        timeout-minutes: 6
        run: node scripts/test-node.mjs
      - name: FFI suite
        timeout-minutes: 5
        run: node --test --test-timeout=15000 'dist-test/test/ffi/**/*.test.js'
      - name: Build scheduler-yield observer
        run: clang -dynamiclib -O2 .github/diagnostics/yield-probe.c -o .github/diagnostics/yield-probe.dylib
      - name: Repeat concurrency gate with native-call and CPU timing
        env:
          DYLD_INSERT_LIBRARIES: ${{ github.workspace }}/.github/diagnostics/yield-probe.dylib
        run: python3 .github/diagnostics/repeat.py
      - name: Inject 10 ms scheduler-yield delay
        env:
          DYLD_INSERT_LIBRARIES: ${{ github.workspace }}/.github/diagnostics/yield-probe.dylib
          HTTP3_INJECT_YIELD_DELAY: '1'
          HTTP3_CONCURRENCY_MAX_MS: '12000'
        run: node scripts/concurrency-gate.mjs 2>&1 | tee diagnostics/yield-injected.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diagnostics-${{ matrix.os }}-node${{ matrix.node }}-${{ matrix.replica }}
          path: diagnostics
          retention-days: 3
