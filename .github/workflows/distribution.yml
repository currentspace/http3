name: Distribution

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: install smoke (${{ matrix.os }}, node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        # The native addon currently publishes Linux and macOS N-API targets.
        os: [ubuntu-latest, macos-latest]
        node-version: ['24.22.1', '26.12.1']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --no-optional

      - name: Build release artifact
        run: pnpm run build

      - name: Run release packaging lane
        run: pnpm run test:release

      - name: Smoke install packed artifact
        run: pnpm run smoke:install
