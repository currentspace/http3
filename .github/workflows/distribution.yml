name: Distribution

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  install-smoke:
    name: install smoke (${{ matrix.os }}, node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        # The native addon currently publishes Linux and macOS N-API targets.
        os: [ubuntu-latest, macos-latest]
        node-version: ['24.22.1', '26.12.1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release artifact
        run: pnpm run build

      - name: Run release packaging lane
        run: pnpm run test:release

      - name: Smoke install packed artifact
        run: node scripts/smoke-install.mjs

      - name: Install browser trust test dependencies
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libnss3-tools ca-certificates
          fi
          pnpm exec playwright install --with-deps chromium

      - name: Verify dev-cert trust, Node clients and Chromium Alt-Svc
        env:
          HTTP3_TEST_INSTALL_DEV_CA: '1'
        run: node scripts/test-dev-cert-browser.mjs
