name: Interop

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: interop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  curl-interop:
    name: TypeScript interop (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.22.1', '26.12.1']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native + tests
        run: pnpm run build && pnpm run build:test

      - name: Run TypeScript interop lane
        run: pnpm run test:interop

  quiche-loopback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: Run quiche UDP loopback interop tests
        run: cargo test --test interop_udp_loopback

      - name: Run quiche direct H3 interop tests
        run: cargo test --test interop_quiche_direct
