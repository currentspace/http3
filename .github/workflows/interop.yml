name: Interop

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: interop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  curl-interop:
    name: TypeScript interop (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.22.1', '26.12.1']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native + tests
        run: pnpm run build && pnpm run build:test

      - name: Run TypeScript interop lane
        run: pnpm run test:interop

  quiche-loopback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - name: Run quiche UDP loopback interop tests
        run: cargo test --test interop_udp_loopback

      - name: Run quiche direct H3 interop tests
        run: cargo test --test interop_quiche_direct
