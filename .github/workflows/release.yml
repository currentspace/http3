name: Release

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: npm dist-tag to publish
        required: true
        default: canary
        type: choice
        options:
          - canary
          - rc
          - latest
      dry_run:
        description: Build prebuilds and dry-run npm publish
        required: true
        default: true
        type: boolean
      qualification_only:
        description: Run artifact and installed-consumer gates without registry or publish steps
        required: true
        default: false
        type: boolean

jobs:
  prebuilds:
    strategy:
      fail-fast: false
      matrix:
        include:
          # BoringSSL 5 CPU probing uses strtoull. Newer glibc headers redirect
          # it to __isoc23_strtoull (GLIBC_2.38); preserve the 0.9.2 ABI floor.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      - run: pnpm install --frozen-lockfile

      - name: Build native prebuild
        run: pnpm exec napi build --release --platform --target ${{ matrix.target }}

      - name: Check Linux glibc compatibility
        if: endsWith(matrix.target, '-gnu')
        run: python3 scripts/check-linux-prebuild-abi.py http3.*.node

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: prebuild-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  build-wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm

      - name: Setup Rust with wasm32-wasip1 target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm32-wasip1-wasi-sdk-33

      - name: Setup wasi-sdk + binaryen
        uses: ./.github/actions/setup-wasi-sdk

      - run: pnpm install --frozen-lockfile

      - name: Build native addon (debug)
        run: npx napi build --platform

      - name: Build wasm client artifact
        run: pnpm run build:wasm

      - name: Run wasm test suite against the built artifact
        run: HTTP3_WASM=1 pnpm run test:wasm

      - name: Upload wasm artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-client-artifact
          path: dist/wasm/http3_client.wasm
          if-no-files-found: error

  validate-prebuilds:
    name: validate (${{ matrix.target }}, node ${{ matrix.node-version }})
    needs: [prebuilds, prebuilds-musl, build-wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node-version: "24.22.1"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node-version: "26.12.1"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            node-version: "24.22.1"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            node-version: "26.12.1"
          - os: macos-26
            target: aarch64-apple-darwin
            node-version: "24.22.1"
          - os: macos-26
            target: aarch64-apple-darwin
            node-version: "26.12.1"
          - os: macos-26-intel
            target: x86_64-apple-darwin
            node-version: "24.22.1"
          - os: macos-26-intel
            target: x86_64-apple-darwin
            node-version: "26.12.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download prebuild artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuild-*
          merge-multiple: true

      - name: Download wasm artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-client-artifact
          path: dist/wasm

      - name: Verify expected prebuilds
        run: node scripts/verify-prebuilds.mjs

      - name: Check Node-API boundary
        run: pnpm run check:napi-boundary

      - name: Build JavaScript artifacts
        run: pnpm run patch:native-loader && pnpm run build:dist && pnpm run build:test

      - name: Run release runtime tests
        run: node --test --test-isolation=none --test-timeout=15000 dist-test/test/release/**/*.test.js

      - name: Run streaming and cancellation regressions
        run: >-
          node --test --test-isolation=none --test-timeout=15000
          dist-test/test/core/request-backpressure.test.js
          dist-test/test/core/response-backpressure.test.js
          dist-test/test/core/client-stream-lifecycle.test.js
          dist-test/test/core/server-stream-lifecycle.test.js
          dist-test/test/core/proxy-timeouts.test.js

      - name: Smoke install packed artifact
        run: node scripts/smoke-install.mjs

      - name: Qualify installed native HTTP and QUIC APIs
        run: |
          node -e 'console.log("Native runtime host:", JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,kernel:require("node:os").release()}))'
          mkdir -p artifacts/packed
          pnpm pack --config.ignore-scripts=true --pack-destination artifacts/packed
          node scripts/pack-host-native.mjs artifacts/packed
          package_version=$(node -p "require('./package.json').version")
          native_target=$(node --input-type=module -e "import { nativePackages, selectNativePackage } from './scripts/native-packages.mjs'; console.log(selectNativePackage(nativePackages()).dir)")
          node scripts/platform-smoke.mjs --native \
            --tarball "artifacts/packed/currentspace-http3-$package_version.tgz" \
            --sidecar "artifacts/packed/currentspace-http3-$native_target-$package_version.tgz"

  publish:
    if: ${{ !inputs.qualification_only }}
    needs: [prebuilds, prebuilds-musl, validate-prebuilds, validate-musl, build-wasm, qualify-fallback]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      - name: Download prebuild artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prebuild-*
          merge-multiple: true

      - name: Download wasm artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-client-artifact
          path: dist/wasm

      - name: Verify expected prebuilds
        run: node scripts/verify-prebuilds.mjs

      - name: Publish npm packages dry run
        if: ${{ inputs.dry_run }}
        env:
          HTTP3_DIST_TAG: ${{ inputs.dist_tag }}
          HTTP3_DRY_RUN: "1"
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm-release.mjs

      - name: Publish npm packages
        if: ${{ !inputs.dry_run }}
        env:
          HTTP3_DIST_TAG: ${{ inputs.dist_tag }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/publish-npm-release.mjs

  prebuilds-musl:
    uses: ./.github/workflows/musl-prebuilds.yml

  validate-musl:
    needs: [prebuilds-musl, build-wasm]
    uses: ./.github/workflows/musl-consumers.yml

  qualify-fallback:
    needs: build-wasm
    uses: ./.github/workflows/platform-fallback.yml
