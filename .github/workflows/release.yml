name: Safari release qualification

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: Qualification label only (no publication)
        required: true
        default: latest
        type: string
      dry_run:
        description: Must remain true; this workflow only validates Safari
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  safari:
    if: ${{ inputs.dry_run }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install current stable Safari only
        run: python3 .github/safari-validation/update-safari.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download final qualified release binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: prebuild-aarch64-apple-darwin
          run-id: 40758754002
          github-token: ${{ github.token }}
      - name: Verify immutable binary and build JavaScript
        run: |
          echo "20868682543a214aa7f933ea9341d15445cbd48a0efb0b2d4660fa507d6434bd  http3.darwin-arm64.node" | shasum -a 256 --check
          pnpm run patch:native-loader
          pnpm run build:dist
          pnpm run build:test
      - name: Install HTTP/3 curl
        run: |
          brew install curl
          echo "QUALIFICATION_CURL=$(brew --prefix curl)/bin/curl" >> "$GITHUB_ENV"
          "$(brew --prefix curl)/bin/curl" --version
      - name: Validate trusted loopback with real Safari
        timeout-minutes: 6
        run: python3 .github/safari-validation/validate.py
      - name: Save qualification receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari-27.2-qualification
          path: artifacts/safari-latest
          if-no-files-found: error
