name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release workflow mode
        required: true
        default: release
        type: choice
        options:
          - release
          - npm-maintenance
      dist_tag:
        description: npm dist-tag to publish
        required: true
        default: canary
        type: choice
        options:
          - canary
          - rc
          - latest
      dry_run:
        description: Build prebuilds and dry-run npm publish
        required: true
        default: true
        type: boolean

jobs:
  prebuilds:
    if: ${{ inputs.mode == 'release' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Ensure Rust >= 1.94
        run: rustup update stable && rustc --version

      - run: pnpm install --frozen-lockfile --no-optional

      - name: Build native prebuild
        run: pnpm exec napi build --release --platform --target ${{ matrix.target }}

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v7
        with:
          name: prebuild-${{ matrix.target }}
          path: "*.node"
          if-no-files-found: error

  validate-prebuilds:
    if: ${{ inputs.mode == 'release' }}
    name: validate (${{ matrix.target }}, node ${{ matrix.node-version }})
    needs: prebuilds
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-version: "24"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-version: "25"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-version: "26"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            node-version: "24"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            node-version: "25"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            node-version: "26"
          - os: macos-26
            target: aarch64-apple-darwin
            node-version: "24"
          - os: macos-26
            target: aarch64-apple-darwin
            node-version: "25"
          - os: macos-26
            target: aarch64-apple-darwin
            node-version: "26"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile --no-optional

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          merge-multiple: true

      - name: Verify expected prebuilds
        run: node scripts/verify-prebuilds.mjs

      - name: Check Node-API boundary
        run: pnpm run check:napi-boundary

      - name: Build JavaScript artifacts
        run: pnpm run patch:native-loader && pnpm run build:dist && pnpm run build:test

      - name: Run release runtime tests
        run: node --test --test-isolation=none --test-timeout=15000 dist-test/test/release/**/*.test.js

      - name: Smoke install packed artifact
        env:
          NPM_CONFIG_OMIT: optional
        run: node scripts/smoke-install.mjs

  publish:
    if: ${{ inputs.mode == 'release' }}
    needs: [prebuilds, validate-prebuilds]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile --no-optional

      - name: Download prebuild artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: prebuild-*
          merge-multiple: true

      - name: Verify expected prebuilds
        run: node scripts/verify-prebuilds.mjs

      - name: Publish npm packages dry run
        if: ${{ inputs.dry_run }}
        env:
          HTTP3_DIST_TAG: ${{ inputs.dist_tag }}
          HTTP3_DRY_RUN: "1"
        run: node scripts/publish-npm-release.mjs

      - name: Publish npm packages
        if: ${{ !inputs.dry_run }}
        env:
          HTTP3_DIST_TAG: ${{ inputs.dist_tag }}
        run: node scripts/publish-npm-release.mjs

  npm-maintenance:
    if: ${{ inputs.mode == 'npm-maintenance' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Configure npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error ::Repository secret NPM_TOKEN is required for npm dist-tag and unpublish maintenance."
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm whoami

      - name: Move canary dist-tag to 0.8.3
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm dist-tag add @currentspace/http3@0.8.3 canary

      - name: Unpublish @currentspace/http3@0.2.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm unpublish @currentspace/http3@0.2.0 --force

      - name: Verify npm state
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm view @currentspace/http3 dist-tags --json --prefer-online
          if npm view @currentspace/http3@0.2.0 version --prefer-online; then
            echo "::error ::@currentspace/http3@0.2.0 is still published"
            exit 1
          fi
