name: Platform fallback qualification

# Called once by release qualification after building the shared WASM artifact.
# Does not introduce another workflow on every push or pull request.
on:
  workflow_call:
    inputs:
      wasm-artifact:
        type: string
        default: wasm-client-artifact

permissions:
  contents: read

jobs:
  installed-fallback:
    name: no native addon (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
        node: ['24.22.1', '26.12.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.16.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.wasm-artifact }}
          path: dist/wasm
      - name: Resolve Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $opensslDir = Join-Path $env:ProgramFiles 'Git\usr\bin'
            if (-not (Test-Path (Join-Path $opensslDir 'openssl.exe'))) {
              throw 'OpenSSL is required to create isolated test certificates'
            }
            $opensslDir >> $env:GITHUB_PATH
          }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:dist
      - name: Installed H2, H3 and raw QUIC without optional native addons
        run: node scripts/platform-smoke.mjs
